<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Repainter's homepage'</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- Custom Styles Start -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css"
      integrity="sha512-xiunq9hpKsIcz42zt0o2vCo34xV0j6Ny8hgEylN3XBglZDtTZ2nwnqF/Z/TTCc18sGdvCjbFInNd++6q3J0N6g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="/css/main.css?rv=0.1.3" rel="stylesheet" />
    <link href="/css/home.css?rv=0.1.3" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/nerdfonts-web@1.0.1/nf.min.css"
    />
    <!-- Custom Styles End -->
    <!-- Google Fonts Start -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="//fonts.googleapis.com/css?family=Roboto+Slab"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Bitcount+Grid+Single:wght@100..900&family=Yuji+Boku&display=swap"
      rel="stylesheet"
    />
    <!-- Google Fonts End -->
    <!-- Scripts Start -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/randomcolor@0.6.2/randomColor.min.js"></script>
    <script src="https://unpkg.com/i18next@25.3.4/dist/umd/i18next.min.js"></script>
    <script src="js/i18next-resources.js?rv=0.1.3"></script>
    <script src="js/rainbow.js"></script>
    <!-- Scripts End -->
  </head>

  <body>
    <main class="container">
      <div class="row">
        <div class="column">
          <h1 class="rainbow" data-i18n="site.heading">Repainter's homepage</h1>
        </div>
      </div>

      <div class="row">
        <div class="column-20" style="justify-items: center">
          <model-viewer
            data-i18n-attr="alt:site.modelAlt"
            alt="The R, 3D"
            src="src/r-3d.glb?rv=0.1.3"
            shadow-intensity="1"
            camera-controls
            touch-action="pan-y"
            camera-orbit="-5deg 100deg"
            poster="src/r-3d.webp?rv=0.1.3"
          ></model-viewer>

          <p class="text-contents">
            <a onclick="changeLanguage('en')" style="margin-right: 1em">
              🇺🇸 English
            </a>
            <a onclick="changeLanguage('ja')">🇯🇵 日本語</a>
          </p>
        </div>

        <div class="column-80 text-contents">
          <p data-i18n="intro.main.0"></p>
          <p data-i18n="intro.main.1"></p>
          <p data-i18n="privacy"></p>

          <p data-i18n="update.stt"></p>
        </div>
      </div>
    </main>
    <div id="particles-js"></div>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="js/main.js?rv=0.1.3"></script>
    <script src="js/i18next-init.js?rv=0.1.3"></script>
  </body>
</html>
